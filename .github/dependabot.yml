version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
    # Matches minimumReleaseAge in pnpm-workspace.yaml, so CI accepts what Dependabot proposes.
    cooldown:
      default-days: 3
    ignore:
      # Astro's checker does not accept TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the oldest Node the kit supports, not the newest release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
  # The workflows `vertical-docs init` writes into a product. Outside the root, Dependabot reads the workflow files that sit directly in the folder.
  - package-ecosystem: github-actions
    directory: /template/.github/workflows
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
