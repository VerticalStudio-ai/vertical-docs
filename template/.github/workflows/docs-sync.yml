name: docs-sync

# After a code change on main, an agent edits the docs to match the change, and the result arrives as one pull request on docs/sync.
# The agent needs a model key: the repository secret ANTHROPIC_API_KEY.
on:
  push:
    branches: [main]
    paths-ignore: ["<folder>/**"]

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: VerticalStudio-ai/vertical-docs/.github/workflows/docs-sync.yml@0bba3cf981e80842890b990434f029954cdbbb11
    with:
      site: <folder>
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
