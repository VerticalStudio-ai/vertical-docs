name: docs

# Checks the docs on a pull request and on main: the build, and every link, anchor and search result in it.
# With a Cloudflare account it also publishes them: main to the live site, a pull request to its own preview address.
# The account is the repository variable CLOUDFLARE_ACCOUNT_ID and the repository secret CLOUDFLARE_API_TOKEN.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Puts the package in node_modules/, where <folder>/wrangler.jsonc finds the Worker, at the version that wrote this file. No dependency runs an install script: none needs one. A repository that has vertical-docs in its own devDependencies runs its own install here instead.
      - run: npm install --no-save --ignore-scripts vertical-docs@<version>
      - run: npx vertical-docs check <folder>
      - if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler@4.161.0 ${{ github.event_name == 'push' && 'deploy' || format('versions upload --preview-alias pr-{0}', github.event.number) }} --config <folder>/wrangler.jsonc --message ${{ github.sha }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
